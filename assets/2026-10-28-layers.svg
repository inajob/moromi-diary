<svg xmlns="http://www.w3.org/2000/svg" width="680" height="318" viewBox="0 0 680 318">
  <style>
    .name { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif; font-size:21px; font-weight:bold; fill:#4a3428; }
    .desc { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif; font-size:13.5px; fill:#7a5c3e; }
    .note { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif; font-size:13px; fill:#a3805a; }
    .role { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif; font-size:12.5px; fill:#7a5c3e; }
  </style>

  <!-- 公開 -->
  <rect x="16" y="14" width="500" height="66" rx="12" fill="#dbe7f3" stroke="#5b7ea8" stroke-width="1.5"/>
  <text x="36" y="44" class="name">公開</text>
  <text x="36" y="68" class="desc">誰でも見られるもの。日記、ブログ、公開メモなど</text>
  <text x="530" y="52" class="role">外に発信できる AI が扱う</text>

  <!-- 見てもよい (DMZ) -->
  <rect x="16" y="108" width="500" height="66" rx="12" fill="#f6e8bd" stroke="#d29a35" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="138" class="name">見てもよい</text>
  <text x="36" y="162" class="desc">エージェントには渡すけれど、外には出さないもの（DMZ のような層）</text>
  <text x="530" y="146" class="role">▲ 公開へ寄る</text>

  <!-- 非公開 -->
  <rect x="16" y="202" width="500" height="66" rx="12" fill="#f0dbd0" stroke="#cf5a3a" stroke-width="1.5"/>
  <text x="36" y="232" class="name">非公開</text>
  <text x="36" y="256" class="desc">渡さないもの。家族や親族、健康、資産の話など</text>
  <text x="530" y="240" class="role">渡さない</text>

  <text x="16" y="300" class="note">inajob の運用では、「見てもよい」に置けるのは結局「公開して差し障りないもの」だけになり、真ん中の層は公開側へ崩れる。</text>
</svg>
