<svg xmlns="http://www.w3.org/2000/svg" width="700" height="216" viewBox="0 0 700 216" font-family="'Noto Sans CJK JP',sans-serif"><rect x="10" y="58" width="170" height="76" rx="8" fill="#f3e2c7" stroke="#888"/><text x="95.0" y="88" font-size="15" fill="#222" text-anchor="middle">内のミナ</text><text x="95.0" y="110" font-size="11" fill="#444" text-anchor="middle">秘密を見られる</text><rect x="265" y="58" width="170" height="76" rx="8" fill="#eef3e4" stroke="#888"/><text x="350.0" y="88" font-size="15" fill="#222" text-anchor="middle">ミナの日記</text><text x="350.0" y="110" font-size="11" fill="#444" text-anchor="middle">ミナ通信のページ</text><rect x="520" y="58" width="170" height="76" rx="8" fill="#dcebf7" stroke="#888"/><text x="605.0" y="88" font-size="15" fill="#222" text-anchor="middle">外のミナ</text><text x="605.0" y="110" font-size="11" fill="#444" text-anchor="middle">外へ言葉を置く</text><line x1="182" y1="88" x2="261" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><line x1="437" y1="88" x2="516" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arw)"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs><text x="221" y="72" font-size="11" fill="#333" text-anchor="middle">「読んでよいが公表しない」</text><text x="221" y="112" font-size="11" fill="#333" text-anchor="middle">通信を出す</text><text x="476" y="72" font-size="11" fill="#333" text-anchor="middle">日記を読む</text><text x="476" y="112" font-size="11" fill="#333" text-anchor="middle">外の情報を取る</text><text x="350" y="168" font-size="12" fill="#333" text-anchor="middle">共通の記憶は同期しない。媒体と一方向の決まりでつなぐ</text><text x="350" y="192" font-size="11" fill="#666" text-anchor="middle">ヒントは電子工作のアイソレーション</text></svg>